services:
  scanner:
    build: .
    image: ghcr.io/simonfrey/eposecure:dev
    restart: unless-stopped
    # .env is passed through whole so config.yaml can reference any ${VAR},
    # e.g. AWS keys for a new cloudlist provider, without touching this file.
    env_file: .env
    environment:
      DATABASE_URL: postgres://exposure:${POSTGRES_PASSWORD}@postgres:5432/exposure?sslmode=disable
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - scanner-home:/home/nonroot
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    environment:
      POSTGRES_DB: exposure
      POSTGRES_USER: exposure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exposure", "-d", "exposure"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:12.4.3@sha256:2e986801428cd689c2358605289c90ab37d2b39e24808874971f54c99bcdc412
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?set SLACK_WEBHOOK_URL in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: receives nuclei's out-of-band callbacks, so blind RCE/SSRF
  # templates work without ProjectDiscovery's public servers. Needs a
  # delegated domain and ports 53, 80 and 443 on this host (see README).
  # Same version as the interactsh client nuclei is built with.
  interactsh:
    image: projectdiscovery/interactsh-server:v1.3.1@sha256:f75d1fdeb0598012ce4560158232a9ad99701da28b31c141dc95d03402e4aa4f
    profiles: [interactsh]
    restart: unless-stopped
    command: -domain ${INTERACTSH_DOMAIN} -token ${INTERACTSH_TOKEN} -disable-update-check
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  grafana-data:
  scanner-home:
