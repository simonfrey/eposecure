# Copy to config.yaml. ${VAR} is replaced with the environment variable VAR
# (from .env). Modules run in the order listed. Every module takes its own options.

discovery: # all run in parallel; if one fails the run fails and nothing is diffed
  # Any cloudlist provider works here: gcp, aws, azure, digitalocean, hetzner,
  # cloudflare, ... See https://github.com/projectdiscovery/cloudlist for the keys.
  - use: cloudlist
    providers:
      - provider: gcp
        id: gcp-org
        organization_id: ${GCP_ORGANIZATION_ID}
        gcp_service_account_key: ${GCP_SERVICE_ACCOUNT_KEY}
      # - provider: aws
      #   id: aws-prod
      #   aws_access_key: ${AWS_ACCESS_KEY_ID}
      #   aws_secret_key: ${AWS_SECRET_ACCESS_KEY}

  # Org-wide Cloud Asset search for every public IP and Cloud Run / Functions /
  # App Engine URL. Overlaps with cloudlist on purpose; targets are deduplicated.
  # asset_types defaults to all types that can be public (addresses, forwarding
  # rules, GKE, Cloud SQL, Cloud Run, Functions, App Engine); list fewer to save
  # API calls.
  - use: gcp_asset_search
    organization_id: ${GCP_ORGANIZATION_ID}
    service_account_key: ${GCP_SERVICE_ACCOUNT_KEY}

  # Subdomains from passive sources (incl. certificate transparency) that
  # resolve. Names that no longer resolve but still have a CNAME are kept as
  # takeover candidates for nuclei's takeover templates.
  - use: dns
    root_domains:
      - example.com
    max_enumeration_minutes: 10
    # Off by default. Finds the owner's other domains in certificate transparency
    # logs (crt.sh, free, no key): other domains on the root domains' certificates,
    # and certificates issued to the same organization (OV/EV). There is no free
    # reverse WHOIS; RDAP is only used to read the root domains' registrant org.
    # Found domains are reported as assets of kind related_domain but not scanned,
    # since they may belong to someone else. auto_scan treats them like root_domains.
    # If crt.sh is down, the last run's related domains are kept.
    # related_domains:
    #   organizations: [] # e.g. ["Example GmbH"]; empty: RDAP registrant + root certs
    #   auto_scan: false
    #   max_certs: 200 # certificate downloads per run, newest first

  # Fixed IPs, CIDRs or hostnames, e.g. networks no cloud API lists.
  # A CIDR larger than max_ips (default 4096) is refused.
  - use: static_list
    targets: [] # e.g. ["203.0.113.0/28", "vpn.example.com"]

scanners: # run in order, each builds on the previous output
  - use: naabu
    top_ports: "1000"
    # extra_ports replaces the default list of cloud service ports outside the
    # top 1000 (Redis, MongoDB, Kubernetes, Docker, Elasticsearch, ...).
    # extra_ports: "6379,27017,9000-9100"
    rate: 300 # packets/s, keep low to not trip Cloud Armor or rate limits
    parallel_hosts: 4 # IPs scanned at once; rate is split between them
  # UDP services that answer a protocol request. Also reports open DNS
  # resolvers, SNMP "public", SSDP and TFTP as findings. Supported ports:
  # 53, 69, 123, 161, 1900.
  # - use: udp
  #   ports: [53, 69, 123, 161, 1900]
  - use: httpx
    rate_limit: 50
    follow_host_redirects: true # same-host redirects only; other hosts' pages are not ours
  - use: banner # service and version on non-HTTP ports (ssh, redis, mysql, ...)
  # Exploit proofs-of-concept for known CVEs (RCE, SQLi, LFI, SSRF, ...). They
  # change nothing, but on a vulnerable host they do run (e.g. `id`, reading
  # /etc/passwd, a time-based SLEEP). dos, fuzz and intrusive stay excluded.
  - use: nuclei # vulnerabilities
    severities: [medium, high, critical]
    exclude_tags: [dos, fuzz, intrusive]
    rate_limit: 50
    concurrency: 10
    # host-spray runs all templates on a few hosts at a time, so hosts finish
    # one after another and progress per host means something. template-spray
    # runs each template on all hosts, so all hosts finish together at the end.
    scan_strategy: host-spray
    # Out-of-band callbacks for blind RCE/SSRF templates go to your own
    # interactsh server (see README). Empty = off, and those templates are
    # skipped. Never the public oast.* servers: a vulnerable host of yours
    # would send its request to a third party.
    interactsh_server: ${INTERACTSH_SERVER}
    interactsh_token: ${INTERACTSH_TOKEN}
  # default-login POSTs vendor default credentials (admin/admin, ...) to login
  # forms. That can trip account lockout and failed-login alerts: tell your
  # security team the scanner's IP before the first run.
  - use: nuclei # exposures: admin panels, leaked files, default logins, TLS, takeovers, at any severity
    severities: [info, low, medium, high, critical]
    tags: [panel, exposure, misconfig, default-login, takeover, ssl]
    exclude_tags: [dos, fuzz, intrusive, headers] # missing security headers are noise here
    # Informational TLS templates that match nearly every host. Mismatched
    # certificates are expected when scanning by IP.
    exclude_ids: [ssl-issuer, ssl-dns-names, tls-version, wildcard-tls, mismatched-ssl-certificate]
    takeover_candidates: true # also check dangling CNAMEs found by dns
    rate_limit: 50
    concurrency: 10
    interactsh_server: ${INTERACTSH_SERVER}
    interactsh_token: ${INTERACTSH_TOKEN}
  - use: cve_lookup
    min_severity: medium
    api_key: ${NVD_API_KEY} # optional; https://nvd.nist.gov/developers/request-an-api-key
    cache_ttl_hours: 20 # reuse NVD answers this long; older ones are still used if NVD is down
  - use: exploit_intel # last: marks CVEs exploited in the wild (CISA KEV) and adds EPSS

# Never scanned, even if discovered. IPs, CIDRs or hostnames. Candidates:
# fragile devices, services billed per request, SaaS vendors' hosts.
exclude: []

# Fail a run instead of reporting closures when open endpoints drop by more
# than this percent, or a discovery module suddenly finds nothing. Accept a
# real drop with: docker compose run --rm scanner run-once --accept-drift
max_endpoint_drop_pct: 50
