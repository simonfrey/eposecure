apiVersion: 1
datasources:
  - name: Exposure
    uid: exposure-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    isDefault: true
    jsonData:
      database: exposure
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
